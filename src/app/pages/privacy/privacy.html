<main class="privacy_page">
  <div class="page_title_sector">
    <h1 class="main_header_title">Політика конфіденційності та обробки даних</h1>
  </div>

  <section class="section_card">
    
    <div class="info_section">
      <div class="section_title_wrap">
        <span class="accent_bar"></span>
        <h2 class="sector_sub_header">Правила безпеки ваших даних</h2>
      </div>

      <div class="methods_grid">
        @for (sec of privacySections; track sec.title) {
          <div class="method_box">
            <h4>{{ sec.title }}</h4>
            <p class="method_desc">{{ sec.desc }}</p>
          </div>
        }
      </div>
    </div>

    <div class="footer_actions">
      <div class="call_us_text">
        <strong>Маєте запитання щодо збереження персональних даних?</strong>
        <p>Зверніться до нашої служби підтримки клієнтів</p>
      </div>
      <div class="action_buttons">
        <a href="tel:0666481318" class="btn_phone">📞 (066) 648-13-18</a>
        <a routerLink="/" class="btn_catalog">Перейти до каталогу</a>
      </div>
    </div>

  </section>
</main>
