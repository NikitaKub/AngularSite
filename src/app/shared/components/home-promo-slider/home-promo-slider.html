<div class="slider-wrapper">
    <div class="slider-container">
        <div class="slides-track" [style.transform]="'translateX(' + (-currentIndex * 100) + '%)'">
            @for (slide of promoSlidesList; track slide.path) {
                <div class="slide">
                    <img [src]="slide.path" [alt]="slide.alt">
                </div>
            }
        </div>

        <button class="nav-btn prev" (click)="prev()">&#10094;</button>
        <button class="nav-btn next" (click)="next()">&#10095;</button>

        <div class="indicators">
            @for (slide of promoSlidesList; track $index) {
                <span 
                    class="dot" 
                    [class.active]="$index === currentIndex" 
                    (click)="goToSlide($index)">
                </span>
            }
        </div>
    </div>
</div>
